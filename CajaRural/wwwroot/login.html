<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Caja Rural – Inicio de sesión</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="pagina-login">

  <main class="tarjeta">

    <!-- Marca: cambia aquí el nombre de la organización -->
    <header class="marca">
      <div class="marca-icono">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6l7-3z"/><path d="M12 8v5"/><circle cx="12" cy="15.5" r=".6" fill="#fff"/></svg>
      </div>
      <div>
        <div class="marca-titulo">Caja Rural <span class="chip chip-verde">CRACUP</span></div>
        <div class="marca-sub">Caja Rural de Emprendedores de San Matías</div>
      </div>
    </header>

    <span class="chip chip-azul">Acceso Seguro</span>
    <h1>Inicio de Sesión</h1>

    <form id="form-login" novalidate>

      <!-- Rol de operación -->
      <fieldset class="campo">
        <legend class="etiqueta">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
          Rol de operación
        </legend>
        <div class="segmentos" role="radiogroup">
          <input type="radio" name="rol" id="rol-presidente" value="Presidente" checked>
          <label for="rol-presidente">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
            Presidente
          </label>

          <input type="radio" name="rol" id="rol-secretaria" value="Secretaria">
          <label for="rol-secretaria">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>
            Secretaria
          </label>

          <input type="radio" name="rol" id="rol-consulta" value="Consulta">
          <label for="rol-consulta">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
            Consulta
          </label>
        </div>
      </fieldset>

      <!-- Usuario -->
      <div class="campo">
        <label for="usuario" class="etiqueta">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
          Identificador de empleado / usuario
        </label>
        <div class="entrada">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M14 10h4M14 14h4M6 16c.5-1.5 1.7-2 3-2s2.5.5 3 2"/></svg>
          <input id="usuario" type="text" autocomplete="username" placeholder="Ej. cmendez">
        </div>
      </div>

      <!-- Contraseña -->
      <div class="campo">
        <div class="fila-etiqueta">
          <label for="clave" class="etiqueta">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3M14 9l2 2"/></svg>
            Contraseña / clave de acceso
          </label>
          <a href="#" id="olvido">¿Olvidó su clave?</a>
        </div>
        <div class="entrada">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>
          <input id="clave" type="password" autocomplete="current-password" placeholder="••••••••">
          <button type="button" id="ver-clave" aria-label="Mostrar u ocultar contraseña">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>

      <p id="mensaje" class="mensaje" role="alert"></p>

      <button type="submit" id="btn-ingresar" class="boton-primario">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>
        Iniciar Sesión
      </button>
    </form>
  </main>

  <script src="js/puente.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
